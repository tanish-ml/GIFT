<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Text Trail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .trail-container {
      position: relative;
      font-size: 8vw;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -2px;
      user-select: none;
      cursor: default;
    }
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }
    .layer:first-child {
      position: relative;
      color: #fff;
      z-index: 10;
    }
    .layer:nth-child(2) { color: rgba(255, 255, 255, 0.6); z-index: 9; }
    .layer:nth-child(3) { color: rgba(255, 0, 100, 0.5); z-index: 8; }
    .layer:nth-child(4) { color: rgba(0, 255, 200, 0.4); z-index: 7; }
    .layer:nth-child(5) { color: rgba(255, 200, 0, 0.3); z-index: 6; }
    .layer:nth-child(6) { color: rgba(255, 255, 255, 0.1); z-index: 5; }
    
    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="trail-container" id="trail">
    <div class="layer">FUTURE</div>
    <div class="layer">FUTURE</div>
    <div class="layer">FUTURE</div>
    <div class="layer">FUTURE</div>
    <div class="layer">FUTURE</div>
    <div class="layer">FUTURE</div>
  </div>

  <script>
    const layers = document.querySelectorAll('.layer');
    let mouseX = 0, mouseY = 0;
    let currentX = 0, currentY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.15;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.15;
    });

    function animate() {
      currentX += (mouseX - currentX) * 0.1;
      currentY += (mouseY - currentY) * 0.1;

      layers.forEach((layer, index) => {
        if (index === 0) return;
        const depth = index * 0.4;
        layer.style.transform = `translate(${currentX * depth}px, ${currentY * depth}px)`;
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
