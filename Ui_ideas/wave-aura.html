<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Wave Mesh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #030305; overflow: hidden; height: 100vh; }
    canvas { display: block; }
    .hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 5vw;
      font-weight: 900;
      letter-spacing: 4px;
      pointer-events: none;
      text-transform: uppercase;
    }
    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 1000;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="hero">SYNTHESIS</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let step = 0;
    let targetFreq = 0.01;
    let currentFreq = 0.01;
    let targetAmp = 80;
    let currentAmp = 80;

    window.addEventListener('mousemove', (e) => {
      targetFreq = 0.005 + (e.clientX / width) * 0.02;
      targetAmp = 30 + (e.clientY / height) * 150;
    });

    const colors = ['#00f2fe', '#4facfe', '#0000ff', '#ff007f'];

    function animate() {
      ctx.fillStyle = 'rgba(3, 3, 5, 0.15)';
      ctx.fillRect(0, 0, width, height);

      // Lerp parameters
      currentFreq += (targetFreq - currentFreq) * 0.05;
      currentAmp += (targetAmp - currentAmp) * 0.05;

      step += 0.03;

      // Draw multiple overlaid wave harmonics
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(0, height / 2);

        for (let x = 0; x < width; x += 5) {
          const harmonic = (i + 1) * 0.5;
          const y = height / 2 + 
            Math.sin(x * currentFreq * harmonic + step + i) * currentAmp * (1 / harmonic);
          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = colors[i];
        ctx.lineWidth = 3 - i * 0.5;
        ctx.shadowColor = colors[i];
        ctx.shadowBlur = 15;
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
