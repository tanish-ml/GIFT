<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Marquee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      height: 200vh; /* Scrollable space */
      padding-top: 40vh;
    }
    .marquee-wrapper {
      width: 100%;
      overflow: hidden;
      background: #ff3366;
      padding: 20px 0;
      white-space: nowrap;
      cursor: grab;
      user-select: none;
    }
    .marquee-wrapper:active { cursor: grabbing; }
    .marquee-track {
      display: inline-flex;
      will-change: transform;
    }
    .item {
      font-size: 3rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0 30px;
    }
    .back-btn {
      position: fixed;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 100;
      background: rgba(17, 17, 17, 0.5);
      backdrop-filter: blur(5px);
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .instructions {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: sans-serif;
      color: rgba(255,255,255,0.6);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="marquee-wrapper" id="marquee">
    <div class="marquee-track" id="track">
      <span class="item">★ Innovation</span>
      <span class="item">★ Digital Craft</span>
      <span class="item">★ Next-Gen Web</span>
      <span class="item">★ Interactive Design</span>
      <span class="item">★ Innovation</span>
      <span class="item">★ Digital Craft</span>
      <span class="item">★ Next-Gen Web</span>
      <span class="item">★ Interactive Design</span>
    </div>
  </div>

  <div class="instructions">Scroll down the page to see the speed shift!</div>

  <script>
    const track = document.getElementById('track');
    let pos = 0;
    let speed = 2;
    let targetSpeed = 2;

    // Continuous motion loop
    function animate() {
      speed += (targetSpeed - speed) * 0.1;
      pos -= speed;
      
      // Infinite loop threshold
      const halfWidth = track.scrollWidth / 2;
      if (Math.abs(pos) >= halfWidth) {
        pos = 0;
      }
      
      track.style.transform = `translateX(${pos}px)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Speed boost on scroll
    window.addEventListener('scroll', () => {
      targetSpeed = 8;
      clearTimeout(window.scrollTimeout);
      window.scrollTimeout = setTimeout(() => {
        targetSpeed = 2;
      }, 150);
    });
  </script>
</body>
</html>
