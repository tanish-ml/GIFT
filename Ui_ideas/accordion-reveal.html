<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Accordion Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .accordion {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: grayscale(80%) brightness(0.6);
      transition: filter 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .panel:nth-child(1) .panel-bg { background-image: url('https://picsum.photos/id/1036/1000/1200'); }
    .panel:nth-child(2) .panel-bg { background-image: url('https://picsum.photos/id/1039/1000/1200'); }
    .panel:nth-child(3) .panel-bg { background-image: url('https://picsum.photos/id/1043/1000/1200'); }

    .panel-content {
      position: absolute;
      bottom: 40px;
      left: 40px;
      white-space: nowrap;
      z-index: 2;
    }
    .panel-content h2 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: -1px;
    }
    .panel-content p {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      color: #aaa;
      margin-top: 5px;
    }

    /* Expand active panel */
    .panel:hover {
      flex: 3;
    }
    .panel:hover .panel-bg {
      filter: grayscale(0%) brightness(0.9);
      transform: scale(1.05);
    }
    .panel:hover .panel-content p {
      opacity: 1;
      transform: translateY(0);
    }
    
    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="accordion">
    <div class="panel">
      <div class="panel-bg"></div>
      <div class="panel-content">
        <h2>01 / Editorial</h2>
        <p>Explore full campaign highlights</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-bg"></div>
      <div class="panel-content">
        <h2>02 / Motion</h2>
        <p>3D animation & visual effects</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-bg"></div>
      <div class="panel-content">
        <h2>03 / Strategy</h2>
        <p>Digital brand engineering</p>
      </div>
    </div>
  </div>

</body>
</html>
