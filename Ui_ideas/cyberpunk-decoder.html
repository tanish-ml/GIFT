<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Text Decoder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #00ff66;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }
    .decode-title {
      font-size: 5vw;
      font-weight: 900;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      background: rgba(0, 255, 102, 0.05);
      padding: 20px 40px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
    }
    .hint {
      margin-top: 20px;
      color: #008833;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #00ff66;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(0,255,102,0.3);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(0,255,102,0.1); }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <h1 class="decode-title" id="decoder" data-value="NEURAL ARCHITECTURE">NEURAL ARCHITECTURE</h1>
  <p class="hint">[ HOVER TO DECRYPT ]</p>

  <script>
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*!¿§";
    const el = document.getElementById('decoder');
    let interval = null;

    function scramble() {
      let iteration = 0;
      clearInterval(interval);

      interval = setInterval(() => {
        el.innerText = el.dataset.value
          .split("")
          .map((letter, index) => {
            if (index < iteration) {
              return el.dataset.value[index];
            }
            return letters[Math.floor(Math.random() * letters.length)];
          })
          .join("");

        if (iteration >= el.dataset.value.length) {
          clearInterval(interval);
        }

        iteration += 1 / 3;
      }, 30);
    }

    // Run on load and on hover
    scramble();
    el.addEventListener('mouseenter', scramble);
  </script>
</body>
</html>
