<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio-Reactive ASCII Cyber-Brain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .start-btn {
      position: fixed;
      z-index: 100;
      background: #00ff66;
      color: #000;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 16px 32px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 30px #00ff66;
      transition: all 0.2s;
    }
    .start-btn:hover {
      background: #fff;
      box-shadow: 0 0 50px #fff;
      transform: scale(1.05);
    }

    .hud-panel {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 10;
      pointer-events: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #00ff66;
      border-left: 3px solid #00ff66;
      padding-left: 12px;
    }

    /* Back to Showcase Button Styling */
    .back-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: #00ff66;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid #00ff66;
      background: rgba(0, 10, 3, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 110;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer !important;
    }
    .back-btn:hover { 
      background: #00ff66; 
      color: #000;
      box-shadow: 0 0 15px #00ff66;
    }
  </style>
</head>
<body>

  <button class="start-btn" id="startBtn">INITIALIZE AUDIO MATRIX</button>
  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="hud-panel" id="hud">
    STATUS: WAITING_FOR_AUDIO_STREAM<br>
    INPUT: NONE
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const hud = document.getElementById('hud');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const RAMP = ' .:-=+*#%@';
    let audioCtx, analyser, dataArray;
    let isAudioActive = false;

    // Generate 3D Fibonacci Sphere Point Cloud
    const numPoints = 1200;
    const points = [];

    for (let i = 0; i < numPoints; i++) {
      const phi = Math.acos(-1 + (2 * i) / numPoints);
      const theta = Math.sqrt(numPoints * Math.PI) * phi;

      points.push({
        baseX: Math.cos(theta) * Math.sin(phi),
        baseY: Math.sin(theta) * Math.sin(phi),
        baseZ: Math.cos(phi),
        x: 0, y: 0, z: 0,
        char: RAMP[Math.floor(Math.random() * RAMP.length)]
      });
    }

    // Mouse rotation angles
    let angleX = 0, angleY = 0;
    let targetAngleX = 0, targetAngleY = 0;

    window.addEventListener('mousemove', (e) => {
      targetAngleY = (e.clientX / width - 0.5) * 4;
      targetAngleX = (e.clientY / height - 0.5) * 4;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Microphone audio stream activation
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(stream);
        
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);

        isAudioActive = true;
        startBtn.style.display = 'none';
        hud.innerHTML = "STATUS: AUDIO_STREAM_CONNECTED<br>DSP_ANALYZER: ACTIVE [60FPS]";
      } catch (err) {
        alert("Microphone permission denied or unsupported!");
      }
    });

    let time = 0;

    function render() {
      time += 0.02;
      ctx.fillStyle = '#000402';
      ctx.fillRect(0, 0, width, height);

      // Smooth mouse rotation lerp
      angleX += (targetAngleX - angleX) * 0.05;
      angleY += (targetAngleY - angleY) * 0.05;

      let audioEnergy = 0;
      if (isAudioActive && analyser) {
        analyser.getByteFrequencyData(dataArray);
        // Average frequency intensity calculation
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        audioEnergy = sum / dataArray.length; // 0 - 255
      }

      const radius = 220 + audioEnergy * 0.8; // Pulsing radius based on audio

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sort 3D points by Z depth for proper rendering order
      const renderedPoints = [];

      for (let i = 0; i < points.length; i++) {
        const p = points[i];

        // Frequency displacement mapped per point index
        let freqDisplacement = 0;
        if (isAudioActive && dataArray) {
          const bin = i % dataArray.length;
          freqDisplacement = (dataArray[bin] / 255) * 80;
        }

        const r = radius + freqDisplacement;

        // 3D Point position calculation
        let x = p.baseX * r;
        let y = p.baseY * r;
        let z = p.baseZ * r;

        // Rotate Y
        let cosY = Math.cos(angleY + time * 0.3), sinY = Math.sin(angleY + time * 0.3);
        let rx = x * cosY - z * sinY;
        let rz = x * sinY + z * cosY;

        // Rotate X
        let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
        let ry = y * cosX - rz * sinX;
        rz = y * sinX + rz * cosX;

        // Perspective 3D Projection
        const fov = 400;
        const scale = fov / (fov + rz + 300);
        const projX = width / 2 + rx * scale;
        const projY = height / 2 + ry * scale;

        renderedPoints.push({
          x: projX,
          y: projY,
          z: rz,
          scale: scale,
          char: p.char,
          energy: audioEnergy
        });
      }

      // Sort array by Z depth (Painter's algorithm)
      renderedPoints.sort((a, b) => b.z - a.z);

      // Draw points as ASCII characters
      for (let i = 0; i < renderedPoints.length; i++) {
        const pt = renderedPoints[i];
        const fontSize = Math.max(8, Math.floor(18 * pt.scale));

        ctx.font = `bold ${fontSize}px monospace`;

        // Color intensity mapped to depth + audio energy
        if (pt.z < -50 && pt.energy > 60) {
          ctx.fillStyle = '#ffffff'; // Audio spike flare
        } else if (pt.z < 100) {
          ctx.fillStyle = '#00ff66'; // High phosphor
        } else {
          ctx.fillStyle = '#003311'; // Deep back
        }

        ctx.fillText(pt.char, pt.x, pt.y);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
