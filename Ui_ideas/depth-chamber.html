<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Depth Flythrough</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 1000vh; /* Increased page height for 8 layers */
      overflow-x: hidden;
    }
    .viewport {
      position: fixed;
      inset: 0;
      perspective: 1000px;
      overflow: hidden;
    }
    .world {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .layer {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -160px;
      margin-top: -210px;
      width: 320px;
      height: 420px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    
    /* Position frames deep in 3D Z-space */
    .layer:nth-child(1) { transform: translate3d(0px, 0px, 0px); }
    .layer:nth-child(2) { transform: translate3d(200px, 100px, -1200px); }
    .layer:nth-child(3) { transform: translate3d(-200px, -50px, -2400px); }
    .layer:nth-child(4) { transform: translate3d(150px, -150px, -3600px); }
    .layer:nth-child(5) { transform: translate3d(-150px, 150px, -4800px); }
    .layer:nth-child(6) { transform: translate3d(250px, -80px, -6000px); }
    .layer:nth-child(7) { transform: translate3d(-250px, 80px, -7200px); }
    .layer:nth-child(8) { transform: translate3d(0px, 0px, -8400px); }

    .layer h2 { font-size: 2.5rem; color: #00e5ff; font-weight: 900; margin-bottom: 10px; }
    .layer p { color: #aaa; letter-spacing: 1px; line-height: 1.4; }
    
    .back-btn {
      position: fixed;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 100;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="viewport">
    <div class="world" id="world">
      <div class="layer">
        <h2>01</h2>
        <p>SCROLL TO DIVE IN</p>
      </div>
      <div class="layer">
        <h2>02</h2>
        <p>DEEP SPATIAL PERSPECTIVE</p>
      </div>
      <div class="layer">
        <h2>03</h2>
        <p>THREE DIMENSIONAL Z-AXIS</p>
      </div>
      <div class="layer">
        <h2>04</h2>
        <p>PARALLAX DEPTH</p>
      </div>
      <div class="layer">
        <h2>05</h2>
        <p>IMMERSIVE CAMERA</p>
      </div>
      <div class="layer">
        <h2>06</h2>
        <p>INFINITE TUNNEL</p>
      </div>
      <div class="layer">
        <h2>07</h2>
        <p>ALMOST THERE</p>
      </div>
      <div class="layer">
        <h2>08</h2>
        <p>THE CORE</p>
      </div>
    </div>
  </div>

  <script>
    const world = document.getElementById('world');
    let targetZ = 0;
    let currentZ = 0;

    window.addEventListener('scroll', () => {
      // Map window scroll position directly to Z translation
      targetZ = window.scrollY * 1.5;
    });

    function animate() {
      // Smooth camera acceleration
      currentZ += (targetZ - currentZ) * 0.08;
      world.style.transform = `translateZ(${currentZ}px)`;
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
