<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Fracture Kernel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    body {
      background: #020202;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #00ff66;
      background: rgba(0,0,0,0.85);
      border: 1px solid #00ff66;
      padding: 10px 16px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    /* Back to Showcase Button Styling */
    .back-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: #00ff66;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid #00ff66;
      background: rgba(0, 10, 3, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 110;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer !important; /* Override standard cursor: none */
    }
    .back-btn:hover { 
      background: #00ff66; 
      color: #000;
      box-shadow: 0 0 15px #00ff66;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Showcase</a>
  <div class="hud" id="hud">REALITY_STABILITY: 100% // FRACTURE_NODES: 0</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const mouse = { x: width / 2, y: height / 2, vx: 0, vy: 0, lx: width / 2, ly: height / 2 };
    
    // Fracture point seeds for dynamic Voronoi splitting
    const nodes = [];
    const maxNodes = 12;

    for (let i = 0; i < maxNodes; i++) {
      nodes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        angle: Math.random() * Math.PI * 2
      });
    }

    window.addEventListener('mousemove', (e) => {
      mouse.vx = e.clientX - mouse.lx;
      mouse.vy = e.clientY - mouse.ly;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.lx = e.clientX;
      mouse.ly = e.clientY;

      // Spawn or agitate fracture nodes on high velocity mouse swipes
      const speed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
      if (speed > 15) {
        const randomNode = nodes[Math.floor(Math.random() * nodes.length)];
        randomNode.x = mouse.x + (Math.random() - 0.5) * 100;
        randomNode.y = mouse.y + (Math.random() - 0.5) * 100;
        randomNode.vx = mouse.vx * 0.5;
        randomNode.vy = mouse.vy * 0.5;
      }
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const RAMP = ' .:-=+*#%@';
    let time = 0;

    function render() {
      time += 0.04;

      ctx.fillStyle = 'rgba(2, 2, 2, 0.4)';
      ctx.fillRect(0, 0, width, height);

      const speed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
      const stability = Math.max(0, Math.min(100, Math.floor(100 - speed * 2)));

      // Update fracture nodes
      nodes.forEach((node, idx) => {
        node.x += node.vx;
        node.y += node.vy;

        // Pull nodes toward cursor like a tethered swarm
        const dx = mouse.x - node.x;
        const dy = mouse.y - node.y;
        node.vx += dx * 0.002;
        node.vy += dy * 0.002;

        node.vx *= 0.95;
        node.vy *= 0.95;
      });

      // Render fractured ASCII Matrix Grid
      const step = 20;
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          
          // Find closest fracture node (Voronoi cell math)
          let minDist = Infinity;
          let closestNode = nodes[0];

          for (let i = 0; i < nodes.length; i++) {
            const ndx = x - nodes[i].x;
            const ndy = y - nodes[i].y;
            const dist = ndx * ndx + ndy * ndy;
            if (dist < minDist) {
              minDist = dist;
              closestNode = nodes[i];
            }
          }

          // Apply local viewport transformation offset based on nearest fracture cell
          const offsetAngle = Math.atan2(y - closestNode.y, x - closestNode.x);
          const warp = Math.sin(minDist * 0.001 - time * 2) * (speed * 0.8);
          
          const drawX = x + Math.cos(offsetAngle) * warp;
          const drawY = y + Math.sin(offsetAngle) * warp;

          const charIdx = Math.floor(Math.abs(Math.sin(x * 0.01 + y * 0.01 + time + warp * 0.1)) * RAMP.length);
          const char = RAMP[Math.min(RAMP.length - 1, charIdx)];

          // Chromatic aberration glitch colors when velocity is high
          if (speed > 20 && Math.random() < 0.1) {
            ctx.fillStyle = '#ff0055'; // Glitch pink
          } else if (speed > 10 && Math.random() < 0.15) {
            ctx.fillStyle = '#00ffff'; // Glitch cyan
          } else if (Math.sqrt(minDist) < 100) {
            ctx.fillStyle = '#ffffff'; // Fractured core
          } else {
            ctx.fillStyle = '#00ff66'; // Nominal green
          }

          ctx.fillText(char, drawX, drawY);
        }
      }

      // Draw dynamic Voronoi fault line connections
      ctx.strokeStyle = `rgba(0, 255, 102, ${Math.min(1, speed / 30)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          if (Math.sqrt(dx * dx + dy * dy) < 250) {
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
          }
        }
      }
      ctx.stroke();

      mouse.vx *= 0.9;
      mouse.vy *= 0.9;

      hud.innerText = `REALITY_STABILITY: ${stability}% // ACTIVE_SHARDS: ${nodes.length} // KINETIC_FORCE: ${Math.floor(speed)}`;

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
