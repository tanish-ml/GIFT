<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Night-Vision Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    body {
      background: #010402;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
    }

    /* Screen CRT overlay */
    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 100;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Custom Thermal HUD Cursor Scope */
    .thermal-scope {
      position: fixed;
      width: 180px;
      height: 180px;
      border: 2px solid #00ff66;
      border-radius: 50%;
      pointer-events: none;
      z-index: 101;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .thermal-scope::before, .thermal-scope::after {
      content: '';
      position: absolute;
      background: rgba(0, 255, 102, 0.5);
    }
    .thermal-scope::before { width: 100%; height: 1px; }
    .thermal-scope::after { width: 1px; height: 100%; }

    .hud-text {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #00ff66;
      font-size: 0.8rem;
      letter-spacing: 2px;
      z-index: 102;
      pointer-events: none;
      background: rgba(0,10,3,0.8);
      padding: 8px 12px;
      border: 1px solid #00ff66;
      border-radius: 4px;
    }

    /* Back to Showcase Button Styling */
    .back-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: #00ff66;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid #00ff66;
      background: rgba(0, 10, 3, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 110;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer !important; /* Override standard cursor: none */
    }
    .back-btn:hover { 
      background: #00ff66; 
      color: #000;
      box-shadow: 0 0 15px #00ff66;
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>
  <a href="index.html" class="back-btn">← Back to Showcase</a>
  <div class="thermal-scope" id="scope"></div>
  <div class="hud-text" id="hud">MODE: THERMAL_OPTICS // MOVE CURSOR TO SCAN</div>

  <canvas id="asciiCanvas"></canvas>

  <script>
    const canvas = document.getElementById('asciiCanvas');
    const ctx = canvas.getContext('2d');
    const scope = document.getElementById('scope');
    const hud = document.getElementById('hud');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const RAMP = ' .:-=+*#%@';
    const mouse = { x: width / 2, y: height / 2, radius: 140 };

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      scope.style.left = `${mouse.x}px`;
      scope.style.top = `${mouse.y}px`;
    });

    let time = 0;

    function render() {
      time += 0.03;
      ctx.fillStyle = '#010402';
      ctx.fillRect(0, 0, width, height);

      const charSize = 14;
      const cols = Math.ceil(width / charSize);
      const rows = Math.ceil(height / charSize);

      ctx.textBaseline = 'top';

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const px = x * charSize;
          const py = y * charSize;

          // Distance to custom thermal scope cursor
          const dx = px - mouse.x;
          const dy = py - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // Base ambient pattern (faint, dark green)
          const wave = Math.sin(x * 0.08 + time) + Math.cos(y * 0.08 + time);
          let intensity = (wave + 2) / 4 * 40; // Low base ambient glow

          // Thermal Spotlight boosting effect
          if (dist < mouse.radius) {
            const factor = (1 - dist / mouse.radius);
            intensity += factor * 215; // Spike intensity under thermal lens
          }

          intensity = Math.min(255, Math.max(0, intensity));
          const charIdx = Math.floor((intensity / 255) * (RAMP.length - 1));
          const char = RAMP[charIdx];

          // Dynamic Thermal Color Gradient Mapping
          if (dist < mouse.radius * 0.3) {
            ctx.fillStyle = '#ffffff'; // Blinding heat core
            ctx.font = `bold ${charSize + 3}px monospace`;
          } else if (dist < mouse.radius * 0.7) {
            ctx.fillStyle = '#ffff00'; // Mid-thermal yellow
            ctx.font = `bold ${charSize + 1}px monospace`;
          } else if (dist < mouse.radius) {
            ctx.fillStyle = '#00ff66'; // High green phosphor
            ctx.font = `bold ${charSize}px monospace`;
          } else {
            ctx.fillStyle = '#002208'; // Dark stealth background
            ctx.font = `${charSize}px monospace`;
          }

          ctx.fillText(char, px, py);
        }
      }

      hud.innerText = `SCANNER: [X:${Math.round(mouse.x)} Y:${Math.round(mouse.y)}] // HEAT_LEVEL: ${distToHeat(mouse.x, mouse.y)}%`;

      requestAnimationFrame(render);
    }

    function distToHeat(x, y) {
      return Math.min(100, Math.floor((x / width) * 100));
    }

    render();
  </script>
</body>
</html>
