<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D ASCII Cyber-Terrain Matrix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .ui-overlay {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 20;
      pointer-events: none;
      border-left: 2px solid #00ff66;
      padding-left: 15px;
    }

    .ui-overlay h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00ff66;
    }

    .ui-overlay p {
      font-size: 0.8rem;
      color: rgba(0, 255, 102, 0.7);
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Back to Showcase Button Styling */
    .back-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: #00ff66;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid #00ff66;
      background: rgba(0, 10, 3, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 100;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer !important;
    }
    .back-btn:hover { 
      background: #00ff66; 
      color: #000;
      box-shadow: 0 0 15px #00ff66;
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>
  
  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <div class="ui-overlay">
    <h1>CYBER_TOPOLOGY v3.0</h1>
    <p>[ MOVE CURSOR TO PITCH & ROLL CAMERA ]</p>
  </div>

  <canvas id="terrainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('terrainCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const RAMP = ' .:-=+*#%@';
    
    // Mouse flight controls
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = (e.clientX / width - 0.5) * 2; // Normalized -1 to 1
      mouse.targetY = (e.clientY / height - 0.5) * 2;
    });

    let time = 0;

    function render() {
      time += 0.03;
      
      // Smooth lerp mouse orientation
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      ctx.fillStyle = '#000602';
      ctx.fillRect(0, 0, width, height);

      const gridCols = 70;
      const gridRows = 45;
      const charWidth = width / gridCols;
      const charHeight = height / gridRows;

      ctx.font = `bold ${Math.floor(charHeight)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Perspective 3D Grid Projection Loop
      for (let r = 0; r < gridRows; r++) {
        // Depth factor (z goes from far to near)
        const depth = (gridRows - r) / gridRows; 
        const perspectiveScale = Math.pow(depth, 1.8);

        for (let c = 0; c < gridCols; c++) {
          const normX = (c / gridCols - 0.5) * 3;
          
          // Camera pitch / roll tilt offset from mouse
          const pitch = mouse.y * 1.5;
          const yaw = mouse.x * 1.2;

          const worldX = normX + yaw * (1 - depth);
          const worldZ = depth * 12 + time * 2;

          // Procedural Multi-Octave Terrain Height Function
          const elevation = 
            Math.sin(worldX * 1.8 + worldZ) * 0.6 +
            Math.cos(worldX * 0.8 - worldZ * 0.5) * 0.8 +
            Math.sin(worldX * 3.5 + worldZ * 2) * 0.2;

          // Screen projection formula
          const screenX = (c + 0.5) * charWidth;
          const screenY = (r + 0.5) * charHeight + (elevation * 25 * perspectiveScale) + (pitch * 50);

          // Luminance mapping based on height peak + atmospheric fog
          let brightness = (elevation + 1.6) / 3.2 * 255;
          brightness *= Math.pow(1 - depth * 0.7, 1.2); // Fog attenuation

          brightness = Math.min(255, Math.max(0, brightness));

          const charIdx = Math.floor((brightness / 255) * (RAMP.length - 1));
          const char = RAMP[charIdx];

          // Phosphor Elevation Color Grading
          if (elevation > 0.8 && depth < 0.6) {
            ctx.fillStyle = '#ffffff'; // Snowy mountain peak
          } else if (elevation > 0.2) {
            ctx.fillStyle = '#00ff66'; // Glowing ridge
          } else if (elevation > -0.5) {
            ctx.fillStyle = '#008833'; // Mid valley
          } else {
            ctx.fillStyle = '#002208'; // Deep abyss
          }

          ctx.fillText(char, screenX, screenY);
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
