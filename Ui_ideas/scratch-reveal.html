<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Mask Reveal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Underneath Layer */
    .under-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #ff0055 0%, #7a00ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .under-layer h1 { font-size: 7vw; font-weight: 900; }

    /* Top Scratch Canvas */
    canvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    .back-btn {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      z-index: 1000;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <div class="under-layer">
    <h1>GOLDEN TICKET</h1>
    <p>YOU REVEALED THE HIDDEN CONTENT</p>
  </div>

  <canvas id="scratchCanvas"></canvas>
  
  <a href="index.html" class="back-btn">← Back to Showcase</a>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Fill top mask layer
    function initMask() {
      ctx.fillStyle = '#111216';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffb900';
      ctx.font = 'bold 2rem sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SCRATCH & HOLD MOUSE TO REVEAL', width / 2, height / 2);
    }
    initMask();

    let isScratching = false;

    window.addEventListener('mousedown', () => isScratching = true);
    window.addEventListener('mouseup', () => isScratching = false);

    window.addEventListener('mousemove', (e) => {
      if (!isScratching) return;

      // Erase destination alpha to reveal underneath layer
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(e.clientX, e.clientY, 50, 0, Math.PI * 2);
      ctx.fill();
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initMask();
    });
  </script>
</body>
</html>
